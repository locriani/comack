services:
  comack:
    build: .
    container_name: comack-server
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data:/app/data
      # Settings: the server reads the repo-root .env (mounted at /app/.env)
      # and writes dashboard/PATCH edits back to it, so they survive container
      # recreation. Create ./.env first (`cp .env.example .env`) — if the host
      # file is missing, Docker creates a directory here and the server cannot
      # read its settings.
      - ./.env:/app/.env
