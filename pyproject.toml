[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comack"
version = "0.1.0"
description = "Room audio in, surreal comics out: a privacy-first e-paper comic appliance."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zach Gardner" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Core server dependencies — everything the API, VAD, transcription plumbing,
# scrambler, compositor and web UI need at import time. The heavy AI wheels are
# optional (see [project.optional-dependencies]); server imports them lazily.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    # nltk: POS tagger + Brown corpus for the privacy scrambler
    "nltk>=3.9",
]

[project.optional-dependencies]
# Local Whisper + FLUX/diffusers inference on the server host itself.
# Without this extra, point FLUX_API_URL / LLM_URL at external endpoints —
# or run the light core for tests and the web UI only.
local-inference = [
    "torch>=2.2.0",
    # diffusers: GGUF-quantized FLUX transformer support
    "diffusers>=0.32.0",
    "gguf>=0.10.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pragmatic floor: pycodestyle errors plus pyflakes. F401 (unused import) and
# F841 (unused variable) are pre-existing in the tree and ignored until a
# dedicated cleanup tightens them.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]
