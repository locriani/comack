[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
# esp-idf-svc 0.53's default and tested ESP-IDF. (The C++ firmware used 5.3.1,
# but esp-idf-svc 0.53 does not compile against 5.3.2's Wi-Fi headers.)
ESP_IDF_VERSION = "v5.5.5"
